[package]
name = "degg-shielded-baseline"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Offline model of the Shielded single-executor baseline: named executor, derived input validity, abort/refund, and sealed local-output delivery"

[lib]
path = "src/lib.rs"

[[bin]]
name = "degg-shielded-vectors"
path = "src/bin/vectors.rs"

[[bin]]
name = "degg-shielded-differ"
path = "src/bin/differ.rs"

[dependencies]
degg-inclusion-availability = { path = "../inclusion-availability" }
degg-relation-ir = { path = "../relation-ir/ir" }

[lints.rust]
unsafe_code = "forbid"
